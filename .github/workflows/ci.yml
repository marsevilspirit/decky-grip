name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Set up Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component clippy,rustfmt
          rustup default 1.85.1

      - run: pnpm install --frozen-lockfile

      - name: Check and build package
        run: node scripts/package.mjs

      - name: Install browser for layout regression
        run: pnpm exec playwright install --with-deps chromium

      - name: Check browser layout
        run: pnpm run test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ github.sha }}
          path: test-results/browser/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: GRIP-${{ github.sha }}
          path: |
            out/package-*/*.zip
            out/package-*/package-receipt.json
            out/package-*/source-receipt.json
          if-no-files-found: error
