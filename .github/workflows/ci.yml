name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Set up Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component clippy,rustfmt
          rustup default 1.85.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

      - name: Download Decky CLI
        run: |
          curl -fsSL \
            -o "$RUNNER_TEMP/decky" \
            https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64
          echo "0d0f8c127cd3dba12b75f771c786194ca9f4f771b4787ae24de8b1af45af4294  $RUNNER_TEMP/decky" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/decky"

      - name: Build Decky package
        run: |
          mkdir -p "$RUNNER_TEMP/grip-package"
          sudo "$RUNNER_TEMP/decky" plugin build \
            -b \
            -o "$RUNNER_TEMP/grip-package" \
            -s directory \
            .

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . "$RUNNER_TEMP/grip-package"

      - uses: actions/upload-artifact@v4
        with:
          name: GRIP-${{ github.sha }}
          path: ${{ runner.temp }}/grip-package/*.zip
          if-no-files-found: error
