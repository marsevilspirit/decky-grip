[package]
name = "grip-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
base64 = "0.22"
html-escape = "0.2"
libc = "0.2"
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
