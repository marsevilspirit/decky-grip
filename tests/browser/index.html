<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GRIP browser layout regression</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      body {
        font-family: sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        border: 0;
        padding: 8px;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
      }
      /* Native library.css layout contract; flow-children is navigation, not CSS. */
      .DialogContent {
        display: flex;
      }
      /* Opaque surfaces for geometry/occlusion checks, not a Steam theme preview. */
      .fixture-dialog-content.DialogContent._DialogLayout {
        background: Canvas;
        color: CanvasText;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/fixture.tsx"></script>
  </body>
</html>
